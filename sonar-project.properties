# SonarCloud / SonarQube configuration for Footlel Frontend
sonar.projectKey=footlel-frontend
sonar.organization=footlel

# Project metadata
sonar.projectName=Footlel Frontend
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=services,assets,componentes
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage configuration pointing to Jest's lcov report
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.coverage.exclusions=**/*.test.js,tests/**,coverage/**,node_modules/**,dist/**,assets/images/**,assets/data/**
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.csv,**/*.txt
