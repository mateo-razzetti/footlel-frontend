<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footlel - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/styles/login.css">
    <!-- Global preferences (theme + animations) -->
    <script src="../../assets/scripts/global-preferences.js" defer></script>
    <!-- User preferences (light mode / animations) -->
    <link rel="stylesheet" href="../../assets/styles/global-preferences.css">
</head>
<body>
    <div class="background-overlay"></div>
    <main class="login-card">
        <header class="card-header">
            <img src="../../assets/images/logo-oscuro.png" alt="Logo Footlel" class="logo-image logo-wrapper" id="main-logo">
            <h1 class="brand-title">FOOTLEL</h1>
        </header>
        <form class="login-form" action="#" method="POST" novalidate>
            <div class="form-group">
                <input class="form-input" type="text" id="username" name="username" placeholder="Ingresá tu usuario" autocomplete="username" required>
            </div>
            <div class="form-group">
                <div class="input-toggle-wrapper">
                    <input class="form-input" type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                    <button type="button" class="toggle-visibility" aria-label="Mostrar contraseña" data-target="password">
                        <svg class="eye-icon" id="eye-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <a href="recuperar.html" class="forgot-password">Olvidé mi contraseña</a>
            </div>
            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>
        <nav class="secondary-links">
            <a href="registro.html" class="link-register">Registrarse</a>
            <a href="#" class="link-guest">Continuar como invitado</a>
        </nav>
    </main>

    <script type="module" src="../../services/apiConfig.js"></script>
    <script>
        const API_BASE_URL = String(window.API_BASE_URL || 'https://footlel-backend.onrender.com').replace(/\/+$/, '');
        /* ── Password visibility toggle ────────────────────────── */
        const EYE_CLOSED = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>`;

        const EYE_OPEN = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>`;

        document.querySelectorAll('.toggle-visibility').forEach(btn => {
            btn.addEventListener('click', () => {
                const input   = document.getElementById(btn.dataset.target);
                const svg     = document.getElementById(`eye-${btn.dataset.target}`);
                const showing = input.type === 'text';

                input.type    = showing ? 'password' : 'text';
                svg.innerHTML = showing ? EYE_CLOSED : EYE_OPEN;
                btn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
            });
        });

        /* ── Log in (registered user) ──────────────────── */
        const loginForm = document.querySelector('.login-form');
        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const usernameVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value.trim();

            // ── Reusable error element (created only once) ──
            let errorEl = document.getElementById('login-general-error');
            if (!errorEl) {
                errorEl = document.createElement('p');
                errorEl.id = 'login-general-error';
                errorEl.className = 'field-error';
                errorEl.style.marginBottom = '12px';
                loginForm.prepend(errorEl);
            }

            // ── Sequential validation with specific messages ──
            if (!usernameVal) {
                errorEl.textContent = 'Falta ingresar el usuario.';
                errorEl.hidden = false;
                document.getElementById('username').focus();
                return;
            }
            if (!passwordVal) {
                errorEl.textContent = 'Falta ingresar la contraseña.';
                errorEl.hidden = false;
                document.getElementById('password').focus();
                return;
            }
            errorEl.hidden = true;

            // ── Fetch to the login endpoint ──
            try {
                const response = await fetch(`${API_BASE_URL}/auth/user-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_name: usernameVal,
                        user_password: passwordVal
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('footlel_guest', 'false');
                    localStorage.setItem('footlel_username', usernameVal);
                    localStorage.removeItem('footlel_password');
                    
                    // Always query GET /user/get-user-info/{user_name} to ensure footlel_user_id is obtained and saved.
                    let resolvedUserId = data.user_id ?? data.id ?? null;
                    let resolvedUserStrid = data.user_strid || null;
                    try {
                        const infoResponse = await fetch(`${API_BASE_URL}/user/get-user-info/${encodeURIComponent(usernameVal)}`);
                        if (infoResponse.ok) {
                            const info = await infoResponse.json();
                            resolvedUserId = info.user_id ?? info.id ?? resolvedUserId;
                            resolvedUserStrid = info.user_strid || resolvedUserStrid;
                        }
                    } catch (infoError) {
                        console.error('No se pudo obtener el user_id desde get-user-info:', infoError);
                    }
                    if (resolvedUserId !== null && resolvedUserId !== undefined && String(resolvedUserId).trim() !== '') {
                        localStorage.setItem('footlel_user_id', String(resolvedUserId));
                    }
                    localStorage.setItem(
                        'footlel_user_strid',
                        String(resolvedUserId ?? resolvedUserStrid ?? usernameVal)
                    );

                    // Restore the redirect
                    window.location.href = 'menu.html';
                } else {
                    // ── Backend error: show message ──
                    const data = await response.json();
                    errorEl.textContent = data.detail || data.message || 'Error al iniciar sesión';
                    errorEl.hidden = false;
                }
            } catch (error) {
                errorEl.textContent = 'No se pudo conectar con el servidor. Intentá más tarde.';
                errorEl.hidden = false;
            }
        });

        function extractGuestName(guestData) {
            if (typeof guestData === 'string' && guestData.trim()) {
                return guestData.trim();
            }
            if (guestData && typeof guestData === 'object') {
                const candidate =
                    guestData.user_strid ||
                    guestData.guest_name ||
                    guestData.user_name ||
                    (typeof guestData.result === 'string' && guestData.result.toLowerCase() !== 'success'
                        ? guestData.result
                        : null) ||
                    guestData.result;
                if (candidate && String(candidate).trim()) {
                    return String(candidate).trim();
                }
            }
            return null;
        }

        /* ── Continue as guest ──────────────────────────────── */
        const guestLink = document.querySelector('.link-guest');
        guestLink.addEventListener('click', async function (e) {
            e.preventDefault();
            localStorage.setItem('footlel_guest', 'true');
            try {
                const guestResponse = await fetch(`${API_BASE_URL}/auth/guest-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (guestResponse.ok) {
                    const guestData = await guestResponse.json();
                    const guestName = extractGuestName(guestData) || 'Invitado';
                    localStorage.setItem('footlel_user_strid', String(guestName));
                    localStorage.setItem('footlel_username', String(guestName));
                } else {
                    const fallbackName = localStorage.getItem('footlel_user_strid') || localStorage.getItem('footlel_username') || 'Invitado';
                    localStorage.setItem('footlel_user_strid', String(fallbackName));
                    localStorage.setItem('footlel_username', String(fallbackName));
                }
            } catch (guestError) {
                const fallbackName = localStorage.getItem('footlel_user_strid') || localStorage.getItem('footlel_username') || 'Invitado';
                localStorage.setItem('footlel_user_strid', String(fallbackName));
                localStorage.setItem('footlel_username', String(fallbackName));
            }
            window.location.href = 'menu.html';
        });
    </script>
</body>
</html>
