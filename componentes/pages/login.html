<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footlel - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/styles/login.css">
    <!-- Global preferences (theme + animations) -->
    <script src="../../assets/scripts/global-preferences.js" defer></script>
    <!-- User preferences (light mode / animations) -->
    <link rel="stylesheet" href="../../assets/styles/global-preferences.css">
</head>
<body>
    <div class="background-overlay"></div>
    <main class="login-card">
        <header class="card-header">
            <img src="../../assets/images/logo-oscuro.png" alt="Logo Footlel" class="logo-image logo-wrapper" id="main-logo">
            <h1 class="brand-title">FOOTLEL</h1>
        </header>
        <form class="login-form" action="#" method="POST" novalidate>
            <div id="login-error" class="field-error error-alert-box" role="alert" aria-live="polite" style="margin-bottom: 14px;" hidden></div>
            <div class="form-group">
                <input class="form-input" type="text" id="username" name="username" placeholder="Ingresá tu usuario" autocomplete="username" required>
            </div>
            <div class="form-group">
                <div class="input-toggle-wrapper">
                    <input class="form-input" type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                    <button type="button" class="toggle-visibility" aria-label="Mostrar contraseña" data-target="password">
                        <svg class="eye-icon" id="eye-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <a href="recuperar.html" class="forgot-password">Olvidé mi contraseña</a>
            </div>
            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>
        <nav class="secondary-links">
            <a href="registro.html" class="link-register">Registrarse</a>
            <a href="#" class="link-guest">Continuar como invitado</a>
        </nav>
    </main>

    <script type="module" src="../../services/apiConfig.js"></script>
    <script>
        const API_BASE_URL = String(window.API_BASE_URL || 'https://footlel-backend.onrender.com').replace(/\/+$/, '');
        /* ── Password visibility toggle ────────────────────────── */
        const EYE_CLOSED = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>`;

        const EYE_OPEN = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>`;

        document.querySelectorAll('.toggle-visibility').forEach(btn => {
            btn.addEventListener('click', () => {
                const input   = document.getElementById(btn.dataset.target);
                const svg     = document.getElementById(`eye-${btn.dataset.target}`);
                const showing = input.type === 'text';

                input.type    = showing ? 'password' : 'text';
                svg.innerHTML = showing ? EYE_CLOSED : EYE_OPEN;
                btn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
            });
        });

        /* ── Base Robot Avatars & Backend Error Formatter ──────── */
        const BASE_ROBOT_AVATARS = [
            'https://api.dicebear.com/8.x/bottts/svg?seed=footlel-1&backgroundColor=292929',
            'https://api.dicebear.com/8.x/bottts/svg?seed=footlel-2&backgroundColor=292929',
            'https://api.dicebear.com/8.x/bottts/svg?seed=footlel-3&backgroundColor=292929',
            'https://api.dicebear.com/8.x/bottts/svg?seed=footlel-4&backgroundColor=292929',
            'https://api.dicebear.com/8.x/bottts/svg?seed=footlel-5&backgroundColor=292929',
            'https://api.dicebear.com/8.x/bottts/svg?seed=footlel-6&backgroundColor=292929'
        ];

        function pickRandomRobotAvatar() {
            return BASE_ROBOT_AVATARS[Math.floor(Math.random() * 6)];
        }

        function ensureRegisteredUserAvatar(username) {
            const cleanUser = String(username || '').trim().replace(/^@+/, '');
            if (!cleanUser) return;
            const userAvatarKey = 'footlel_avatar_' + cleanUser;
            let userAvatar = localStorage.getItem(userAvatarKey);
            if (!userAvatar || userAvatar.includes('avatar-default.png') || userAvatar.includes('seed=footlel-default')) {
                userAvatar = pickRandomRobotAvatar();
                localStorage.setItem(userAvatarKey, userAvatar);
            }
            localStorage.setItem('footlel_avatar', userAvatar);
        }

        function assignRandomGuestAvatar() {
            const randomAvatar = pickRandomRobotAvatar();
            localStorage.setItem('footlel_guest_avatar', randomAvatar);
            localStorage.setItem('footlel_avatar', randomAvatar);
            return randomAvatar;
        }

        const ALERT_ICON_SVG = `<svg class="error-alert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;

        function formatBackendError(rawMsg) {
            if (window.FootlelPrefs && typeof window.FootlelPrefs.formatBackendError === 'function') {
                return window.FootlelPrefs.formatBackendError(rawMsg);
            }
            if (!rawMsg) return 'Ocurrió un error inesperado.';
            let msg = String(rawMsg).trim();
            if (msg.startsWith('{')) {
                try {
                    const parsed = JSON.parse(msg);
                    if (parsed && (parsed.detail || parsed.message)) {
                        msg = String(parsed.detail || parsed.message).trim();
                    }
                } catch (_) {}
            }
            msg = msg.replace(/^error(\s+de\s+[a-záéíóúñ\s]+)?:\s*/i, '');
            msg = msg
                .replace(/\bcontrasenias\b/gi, 'contraseñas')
                .replace(/\bcontrasenia\b/gi, 'contraseña')
                .replace(/\binvalidos\b/gi, 'inválidos')
                .replace(/\binvalidas\b/gi, 'inválidas')
                .replace(/\binvalido\b/gi, 'inválido')
                .replace(/\binvalida\b/gi, 'inválida')
                .replace(/\bcodigos\b/gi, 'códigos')
                .replace(/\bcodigo\b/gi, 'código')
                .replace(/\bcorreo\s+electronico\b/gi, 'correo electrónico')
                .replace(/\belectronico\b/gi, 'electrónico')
                .replace(/\bnumeros\b/gi, 'números')
                .replace(/\bnumero\b/gi, 'número')
                .replace(/\btelefono\b/gi, 'teléfono')
                .replace(/\bsesion\b/gi, 'sesión')
                .replace(/\bverificacion\b/gi, 'verificación')
                .replace(/\bautenticacion\b/gi, 'autenticación')
                .replace(/\bconfiguracion\b/gi, 'configuración')
                .replace(/\binformacion\b/gi, 'información')
                .replace(/\bconexion\b/gi, 'conexión')
                .replace(/\boperacion\b/gi, 'operación')
                .replace(/\bmanana\b/gi, 'mañana')
                .replace(/\bminimo\b/gi, 'mínimo')
                .replace(/\bmaximo\b/gi, 'máximo')
                .replace(/\bexito\b/gi, 'éxito');
            if (msg.length > 0) {
                msg = msg.charAt(0).toUpperCase() + msg.slice(1);
            }
            if (msg.length > 0 && !/[.!?]$/.test(msg)) {
                msg += '.';
            }
            return msg;
        }

        function showLoginError(errorEl, rawMsg) {
            const cleanText = formatBackendError(rawMsg);
            errorEl.innerHTML = `${ALERT_ICON_SVG}<span class="error-alert-text"></span>`;
            errorEl.querySelector('.error-alert-text').textContent = cleanText;
            errorEl.hidden = false;
        }

        /* ── Log in (registered user) ──────────────────── */
        const loginForm = document.querySelector('.login-form');
        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const usernameVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value.trim();

            // ── Reusable error element (#login-error) ──
            let errorEl = document.getElementById('login-error') || document.getElementById('login-general-error');
            if (!errorEl) {
                errorEl = document.createElement('div');
                errorEl.id = 'login-error';
                errorEl.className = 'field-error error-alert-box';
                errorEl.style.marginBottom = '14px';
                loginForm.prepend(errorEl);
            }

            // ── Sequential validation with specific messages ──
            if (!usernameVal) {
                showLoginError(errorEl, 'Falta ingresar el usuario.');
                document.getElementById('username').focus();
                return;
            }
            if (!passwordVal) {
                showLoginError(errorEl, 'Falta ingresar la contraseña.');
                document.getElementById('password').focus();
                return;
            }
            errorEl.hidden = true;

            // ── Fetch to the login endpoint ──
            try {
                const response = await fetch(`${API_BASE_URL}/auth/user-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_name: usernameVal,
                        user_password: passwordVal
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    let finalUsername = usernameVal.replace(/^@+/, '');
                    localStorage.setItem('footlel_guest', 'false');
                    localStorage.setItem('footlel_username', finalUsername);
                    localStorage.removeItem('footlel_password');

                    const token = data.access_token || data.token || data.jwt || (typeof data === 'string' ? data : null);
                    if (token) {
                        localStorage.setItem('footlel_token', token);
                    }

                    let resolvedUserId = data.user_id ?? data.id ?? null;
                    if (resolvedUserId !== null && resolvedUserId !== undefined) {
                        localStorage.setItem('footlel_user_id', String(resolvedUserId));
                        localStorage.setItem('footlel_user_strid', String(resolvedUserId));
                    }

                    try {
                        // Fetch user profile information and user preferences in parallel right after login
                        const [infoResponse, configResponse] = await Promise.all([
                            // Request 1: GET /user/get-user-info with the JWT token
                            fetch(`${API_BASE_URL}/user/get-user-info`, {
                                headers: { 'Authorization': 'Bearer ' + token }
                            }),
                            // Request 2: GET /config/get-user-config to preload theme & animation preferences before redirecting
                            fetch(`${API_BASE_URL}/config/get-user-config`, {
                                headers: { 'Authorization': 'Bearer ' + token }
                            })
                        ]);

                        // Process user profile response if 200 OK
                        if (infoResponse.ok) {
                            const userInfo = await infoResponse.json();
                            const finalUserId = userInfo.user_id ?? resolvedUserId;
                            if (finalUserId !== undefined && finalUserId !== null) {
                                localStorage.setItem('footlel_user_id', String(finalUserId));
                                localStorage.setItem('footlel_user_strid', String(finalUserId));
                            }
                            localStorage.setItem('footlel_email', userInfo.user_email || '');
                            if (userInfo.user_name) {
                                // Clean any leading '@' before saving username to localStorage
                                const cleanName = String(userInfo.user_name).trim().replace(/^@+/, '');
                                finalUsername = cleanName || finalUsername;
                                localStorage.setItem('footlel_username', finalUsername);
                            }
                        }

                        // Process user configuration response if 200 OK (prevents UI flicker on menu.html load)
                        if (configResponse.ok) {
                            // Parse JSON payload: { dark_mode, animation_state, compatibility_mode }
                            const userConfig = await configResponse.json();
                            // Map dark_mode boolean to 'dark' or 'light' theme key in localStorage
                            if (typeof userConfig.dark_mode === 'boolean') {
                                localStorage.setItem('footlel_theme', userConfig.dark_mode ? 'dark' : 'light');
                            }
                            // Map animation_state boolean to string in localStorage
                            if (typeof userConfig.animation_state === 'boolean') {
                                localStorage.setItem('pref_toggle-animaciones', String(userConfig.animation_state));
                            }
                            // Map compatibility_mode boolean to string in localStorage
                            if (typeof userConfig.compatibility_mode === 'boolean') {
                                localStorage.setItem('pref_toggle-compat', String(userConfig.compatibility_mode));
                            }
                        }
                    } catch (infoError) {
                        console.error('No se pudo obtener la info o configuración inicial:', infoError);
                    }

                    // Ensure registered user has a base robot avatar assigned (or restore existing one)
                    ensureRegisteredUserAvatar(finalUsername);

                    // Restore the redirect
                    window.location.href = 'menu.html';
                } else {
                    // ── Backend error: show formatted message with modern alert design ──
                    const data = await response.json();
                    showLoginError(errorEl, data.detail || data.message || 'Error al iniciar sesión');
                }
            } catch (error) {
                showLoginError(errorEl, 'No se pudo conectar con el servidor. Intentá más tarde.');
            }
        });

        function formatGuestName(rawName) {
            if (rawName === null || rawName === undefined) return null;
            const trimmed = String(rawName).trim();
            if (!trimmed || trimmed.toLowerCase() === 'null' || trimmed.toLowerCase() === 'undefined') {
                return null;
            }
            return /^\d+$/.test(trimmed) ? `Guest_${trimmed}` : trimmed;
        }

        function extractGuestToken(guestData) {
            if (!guestData) return null;
            if (typeof guestData === 'string') {
                const s = guestData.trim();
                if (/^[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+$/.test(s)) return s;
                return null;
            }
            if (typeof guestData === 'object') {
                const candidate =
                    guestData.access_token ||
                    guestData.token ||
                    guestData.jwt ||
                    (guestData.data && (guestData.data.access_token || guestData.data.token || guestData.data.jwt));
                if (candidate && String(candidate).trim()) {
                    return String(candidate).trim();
                }
            }
            return null;
        }

        function decodeJwtSub(token) {
            if (!token || typeof token !== 'string') return null;
            try {
                const parts = token.split('.');
                if (parts.length < 2) return null;
                const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                const json = JSON.parse(atob(base64));
                return json && (json.sub ?? json.user_id ?? json.user_name ?? json.id) || null;
            } catch (e) {
                return null;
            }
        }

        function extractGuestName(guestData) {
            if (typeof guestData === 'string' && guestData.trim()) {
                const s = guestData.trim();
                if (/^[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+$/.test(s)) return null;
                return formatGuestName(s);
            }
            if (guestData && typeof guestData === 'object') {
                const candidate =
                    guestData.user_strid ||
                    guestData.guest_name ||
                    guestData.user_name ||
                    guestData.username ||
                    guestData.user_id ||
                    guestData.id ||
                    (typeof guestData.result === 'string' && guestData.result.toLowerCase() !== 'success'
                        ? guestData.result
                        : null);
                if (candidate !== null && candidate !== undefined && String(candidate).trim()) {
                    return formatGuestName(candidate);
                }
            }
            return null;
        }

        /* ── Continue as guest ──────────────────────────────── */
        const guestLink = document.querySelector('.link-guest');
        guestLink.addEventListener('click', async function (e) {
            e.preventDefault();
            localStorage.removeItem('footlel_token');
            localStorage.setItem('footlel_guest', 'true');
            // Asignar automáticamente uno de los 6 avatares robot de forma aleatoria para la sesión de invitado
            assignRandomGuestAvatar();
            try {
                const guestResponse = await fetch(`${API_BASE_URL}/auth/guest-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (guestResponse.ok) {
                    const guestData = await guestResponse.json();
                    const guestToken = extractGuestToken(guestData);
                    if (guestToken) {
                        localStorage.setItem('footlel_token', guestToken);
                    }
                    let guestName = extractGuestName(guestData);
                    if (!guestName && guestToken) {
                        try {
                            const infoRes = await fetch(`${API_BASE_URL}/user/get-user-info`, {
                                headers: { 'Authorization': 'Bearer ' + guestToken }
                            });
                            if (infoRes.ok) {
                                const infoData = await infoRes.json();
                                guestName = formatGuestName(infoData.user_name || infoData.guest_name || infoData.user_strid || infoData.user_id);
                            }
                        } catch (infoErr) {
                            // Ignored; fall back to JWT sub or default
                        }
                        if (!guestName) {
                            guestName = formatGuestName(decodeJwtSub(guestToken));
                        }
                    }
                    const finalGuestName = formatGuestName(guestName) || 'Invitado';
                    localStorage.setItem('footlel_user_strid', String(finalGuestName));
                    localStorage.setItem('footlel_username', String(finalGuestName));
                } else {
                    const rawFallback = localStorage.getItem('footlel_username') || localStorage.getItem('footlel_user_strid') || 'Invitado';
                    const fallbackName = formatGuestName(rawFallback) || 'Invitado';
                    localStorage.setItem('footlel_user_strid', String(fallbackName));
                    localStorage.setItem('footlel_username', String(fallbackName));
                }
            } catch (guestError) {
                const rawFallback = localStorage.getItem('footlel_username') || localStorage.getItem('footlel_user_strid') || 'Invitado';
                const fallbackName = formatGuestName(rawFallback) || 'Invitado';
                localStorage.setItem('footlel_user_strid', String(fallbackName));
                localStorage.setItem('footlel_username', String(fallbackName));
            }
            window.location.href = 'menu.html';
        });
    </script>
</body>
</html>
