<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footlel - Nueva Contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/styles/login.css">
    <link rel="stylesheet" href="../../assets/styles/nueva-clave.css">
    <!-- Global preferences (theme + animations) -->
    <script src="../../assets/scripts/global-preferences.js" defer></script>
    <!-- User preferences (light mode / animations) -->
    <link rel="stylesheet" href="../../assets/styles/global-preferences.css">
</head>
<body>
    <div class="background-overlay"></div>
    <main class="login-card">

        <header class="card-header">
            <img src="../../assets/images/logo-oscuro.png" alt="Logo Footlel" class="logo-image logo-wrapper" id="main-logo">
            <h1 class="brand-title new-password-title">Cambiar Contraseña</h1>
        </header>

        <form class="login-form" id="new-password-form" action="login.html" method="GET" novalidate>

            <div class="form-group">
                <label class="form-label" for="new-password">Nueva contraseña</label>
                <div class="input-toggle-wrapper">
                    <input
                        class="form-input"
                        type="password"
                        id="new-password"
                        name="new-password"
                        placeholder="Ingresá tu nueva clave"
                        autocomplete="new-password"
                        required
                    >
                    <button type="button" class="toggle-visibility" aria-label="Mostrar contraseña" data-target="new-password">
                        <svg class="eye-icon" id="eye-new-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm-new-password">Reescriba la contraseña</label>
                <div class="input-toggle-wrapper">
                    <input
                        class="form-input"
                        type="password"
                        id="confirm-new-password"
                        name="confirm-new-password"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        required
                    >
                    <button type="button" class="toggle-visibility" aria-label="Mostrar contraseña" data-target="confirm-new-password">
                        <svg class="eye-icon" id="eye-confirm-new-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <!-- Mismatch error message (hidden by default) -->
                <p class="field-error" id="mismatch-error" aria-live="polite" hidden>
                    Las contraseñas no coinciden.
                </p>
            </div>

            <button type="submit" class="btn-primary">Guardar</button>
        </form>

        <nav class="secondary-links">
            <a href="login.html" class="link-cancel">Cancelar</a>
        </nav>

    </main>

    <script type="module" src="../../services/apiConfig.js"></script>
    <script>
        const API_BASE_URL = String(window.API_BASE_URL || 'https://footlel-backend.onrender.com').replace(/\/+$/, '');

        const EYE_CLOSED = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>`;

        const EYE_OPEN = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>`;

        /* ── Eye toggle: single SVG mutated via innerHTML ── */
        document.querySelectorAll('.toggle-visibility').forEach(btn => {
            btn.addEventListener('click', () => {
                const input   = document.getElementById(btn.dataset.target);
                const svg     = document.getElementById(`eye-${btn.dataset.target}`);
                const showing = input.type === 'text';

                input.type    = showing ? 'password' : 'text';
                svg.innerHTML = showing ? EYE_CLOSED : EYE_OPEN;
                btn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
            });
        });

        function extractBackendErrorDetail(data, fallbackMsg) {
            if (!data) return fallbackMsg;
            if (typeof data.detail === 'string' && data.detail.trim()) {
                return data.detail.trim();
            }
            if (Array.isArray(data.detail) && data.detail.length > 0) {
                const first = data.detail[0];
                if (typeof first === 'string') return first;
                if (first && typeof first.msg === 'string') return first.msg;
            }
            if (typeof data.message === 'string' && data.message.trim()) {
                return data.message.trim();
            }
            return fallbackMsg;
        }

        /* ── Sequential validation & Backend PATCH on submit ── */
        const PASSWORD_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
        const PASSWORD_ERROR_MSG = 'La contraseña debe tener al menos 8 caracteres, una mayúscula, una minúscula y un número.';

        document.getElementById('new-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const pwdVal     = document.getElementById('new-password').value.trim();
            const confirmVal = document.getElementById('confirm-new-password').value.trim();
            const error      = document.getElementById('mismatch-error');
            const submitBtn  = e.target.querySelector('button[type="submit"]');

            function showError(msg, focusId) {
                error.textContent = msg;
                error.style.color = '#ff5252';
                error.hidden = false;
                if (focusId) {
                    const el = document.getElementById(focusId);
                    if (el) el.focus();
                }
            }

            // ── 1. Empty new password ──
            if (!pwdVal) {
                showError('Falta ingresar la nueva contraseña.', 'new-password');
                return;
            }

            // ── 2. Empty confirm password ──
            if (!confirmVal) {
                showError('Falta confirmar la contraseña.', 'confirm-new-password');
                return;
            }

            // ── 3. Secure password rule ──
            if (!PASSWORD_REGEX.test(pwdVal)) {
                showError(PASSWORD_ERROR_MSG, 'new-password');
                return;
            }

            // ── 4. Passwords do not match ──
            if (pwdVal !== confirmVal) {
                showError('Las contraseñas no coinciden.', 'confirm-new-password');
                return;
            }

            // ── 5. Send new password to Backend (PATCH /user/edit-user-info) ──
            error.hidden = true;
            if (submitBtn) submitBtn.disabled = true;

            const recoveryEmail = (
                sessionStorage.getItem('recovery_email') ||
                localStorage.getItem('recovery_email') ||
                localStorage.getItem('pending_user_email') ||
                localStorage.getItem('footlel_email') ||
                ''
            ).trim();

            let recoveryUsername = (
                sessionStorage.getItem('recovery_user_name') ||
                localStorage.getItem('recovery_user_name') ||
                localStorage.getItem('pending_user_name') ||
                localStorage.getItem('footlel_username') ||
                ''
            ).trim().replace(/^@+/, '');

            if ((!recoveryUsername || /^invitado$/i.test(recoveryUsername) || /^guest_/i.test(recoveryUsername)) && recoveryEmail.includes('@')) {
                recoveryUsername = recoveryEmail.split('@')[0].trim();
            }

            const token = (
                sessionStorage.getItem('recovery_token') ||
                localStorage.getItem('recovery_token') ||
                localStorage.getItem('footlel_token') ||
                ''
            ).trim();

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token && token !== 'null' && token !== 'undefined') {
                    headers['Authorization'] = 'Bearer ' + token;
                }

                const response = await fetch(`${API_BASE_URL}/user/edit-user-info`, {
                    method: 'PATCH',
                    headers,
                    body: JSON.stringify({
                        user_name: recoveryUsername,
                        user_email: recoveryEmail,
                        user_password: pwdVal
                    })
                });

                if (response.ok) {
                    let data = null;
                    try { data = await response.json(); } catch (_) {}

                    if (data && (data.access_token || data.token)) {
                        localStorage.setItem('footlel_token', data.access_token || data.token);
                    }
                    if (recoveryUsername) {
                        localStorage.setItem('footlel_username', recoveryUsername);
                    }
                    if (recoveryEmail) {
                        localStorage.setItem('footlel_email', recoveryEmail);
                    }

                    // Clean up temporary recovery state
                    sessionStorage.removeItem('recovery_email');
                    sessionStorage.removeItem('recovery_user_name');
                    sessionStorage.removeItem('recovery_otp');
                    sessionStorage.removeItem('recovery_token');
                    localStorage.removeItem('recovery_email');
                    localStorage.removeItem('recovery_user_name');
                    localStorage.removeItem('recovery_otp');
                    localStorage.removeItem('recovery_token');

                    window.location.href = 'login.html';
                } else {
                    let errData = null;
                    try { errData = await response.json(); } catch (_) {}
                    const detailMsg = extractBackendErrorDetail(
                        errData,
                        `Error al actualizar la contraseña (HTTP ${response.status}).`
                    );
                    showError(detailMsg, 'new-password');
                    if (submitBtn) submitBtn.disabled = false;
                }
            } catch (networkErr) {
                showError('No se pudo conectar con el servidor. Intentá más tarde.', 'new-password');
                if (submitBtn) submitBtn.disabled = false;
            }
        });

        /* ── Real-time cleanup: hides the error while the user types ── */
        ['new-password', 'confirm-new-password'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', () => {
                const error = document.getElementById('mismatch-error');
                if (!error.hidden) error.hidden = true;
            });
        });
    </script>
</body>
</html>
