<!DOCTYPE html>
<html lang="es">
<head>
    <script src="../../assets/scripts/global-preferences.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footlel — Editar Cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/styles/editar-cuenta.css">
    <!-- Preferencias de usuario (modo claro / animaciones) -->
    <link rel="stylesheet" href="../../assets/styles/global-preferences.css">
</head>
<body>
<div class="page-shell">
    <header class="site-header" role="banner">
        <a href="menu.html" class="logo-link" aria-label="Footlel — Inicio">
            <img src="../../assets/images/logo-oscuro.png" alt="Logo Footlel" class="logo-img" id="main-logo">
            <span class="logo-text">FOOT<span>LEL</span></span>
        </a>

        <div class="profile-wrapper" id="profileWrapper">
            <button class="profile-btn" id="profileBtn" aria-haspopup="true" aria-expanded="false" aria-controls="profileDropdown" type="button">
                <img src="https://api.dicebear.com/8.x/bottts/svg?seed=footlel-default&backgroundColor=292929" alt="Avatar de usuario" class="profile-avatar" id="headerAvatar">
                <span class="profile-username" id="profileUsername">@nombre_usuario</span>
                <svg class="profile-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>

            <nav class="profile-dropdown" id="profileDropdown" role="menu" aria-label="Opciones de cuenta">
                <a href="configuracion.html" class="dropdown-item" role="menuitem">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Configuración
                </a>
                <a href="editar-cuenta.html" class="dropdown-item" role="menuitem" id="ddEditAccount">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Editar Cuenta
                </a>
                <a href="buscar-usuarios.html" class="dropdown-item" role="menuitem" id="ddFriends">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Mis Amigos
                </a>
                <a href="ayuda.html" class="dropdown-item" role="menuitem">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    Ayuda
                </a>
                <div class="dropdown-divider" role="separator" aria-hidden="true"></div>
                <a href="login.html" class="dropdown-item item-danger" role="menuitem">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </a>
            </nav>
        </div>
    </header>

    <main class="main-content" role="main">
        <div class="edit-account-card">
            <h1 class="card-title">Editar Cuenta</h1>
            <section class="profile-photo-section" aria-label="Foto de perfil">
                <img src="https://api.dicebear.com/8.x/bottts/svg?seed=footlel-default&backgroundColor=292929" alt="Tu avatar actual" class="profile-avatar-large" id="avatarPreview">
                <input type="file" id="fileInput" accept="image/*" hidden aria-label="Subir imagen de perfil">
                <button type="button" class="btn-upload" id="uploadBtn" aria-controls="fileInput">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                    Subir imagen
                </button>
                <p class="avatar-picker-label">O elegí un avatar base:</p>
                <div class="avatar-picker-grid" role="radiogroup" aria-label="Avatares base">
                    <button type="button" class="base-avatar-option" data-avatar="base-1" aria-label="Avatar 1"><img src="https://api.dicebear.com/8.x/bottts/svg?seed=footlel-1&backgroundColor=292929" alt="Avatar base 1" class="base-avatar-img"></button>
                    <button type="button" class="base-avatar-option" data-avatar="base-2" aria-label="Avatar 2"><img src="https://api.dicebear.com/8.x/bottts/svg?seed=footlel-2&backgroundColor=292929" alt="Avatar base 2" class="base-avatar-img"></button>
                    <button type="button" class="base-avatar-option" data-avatar="base-3" aria-label="Avatar 3"><img src="https://api.dicebear.com/8.x/bottts/svg?seed=footlel-3&backgroundColor=292929" alt="Avatar base 3" class="base-avatar-img"></button>
                    <button type="button" class="base-avatar-option" data-avatar="base-4" aria-label="Avatar 4"><img src="https://api.dicebear.com/8.x/bottts/svg?seed=footlel-4&backgroundColor=292929" alt="Avatar base 4" class="base-avatar-img"></button>
                    <button type="button" class="base-avatar-option" data-avatar="base-5" aria-label="Avatar 5"><img src="https://api.dicebear.com/8.x/bottts/svg?seed=footlel-5&backgroundColor=292929" alt="Avatar base 5" class="base-avatar-img"></button>
                    <button type="button" class="base-avatar-option" data-avatar="base-6" aria-label="Avatar 6"><img src="https://api.dicebear.com/8.x/bottts/svg?seed=footlel-6&backgroundColor=292929" alt="Avatar base 6" class="base-avatar-img"></button>
                </div>
            </section>

            <form class="edit-form" id="editAccountForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="username">Nombre de Usuario</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input class="form-input has-icon" type="text" id="username" name="username" placeholder="Tu nombre de usuario" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Correo Electrónico</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input class="form-input has-icon" type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="new-password">Nueva Contraseña</label>
                    <div class="input-with-icon input-toggle-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input class="form-input has-icon" type="password" id="new-password" name="new-password" placeholder="Dejá en blanco para no cambiarla" autocomplete="new-password">
                        <button type="button" class="toggle-visibility" aria-label="Mostrar contraseña" data-target="new-password">
                            <svg class="eye-icon" id="eye-new-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                    <a href="menu.html" class="link-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
(function () {
    'use strict';

    /* Dropdown Logic */
    const profileBtn = document.getElementById('profileBtn');
    const profileDropdown = document.getElementById('profileDropdown');
    const profileWrapper = document.getElementById('profileWrapper');

    function closeDropdown() {
        profileDropdown.classList.remove('is-open');
        profileBtn.setAttribute('aria-expanded', 'false');
    }
    function toggleDropdown() {
        const isOpen = profileDropdown.classList.contains('is-open');
        if (isOpen) {
            closeDropdown();
        } else {
            profileDropdown.classList.add('is-open');
            profileBtn.setAttribute('aria-expanded', 'true');
        }
    }

    profileBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleDropdown();
    });

    document.addEventListener('click', function(e) {
        if (!profileWrapper.contains(e.target)) {
            closeDropdown();
        }
    });

    /* User Profile Setup (Conexión Backend) */
    document.addEventListener('DOMContentLoaded', async function () {
        const savedUsername = localStorage.getItem('footlel_username') || 'Usuario';
        const savedAvatar   = localStorage.getItem('footlel_avatar');

        // Pre-cargar UI básica (Nombre visual y Avatar)
        const profileUsername = document.getElementById('profileUsername');
        if (profileUsername) profileUsername.textContent = '@' + savedUsername;

        document.getElementById('username').value = savedUsername;

        if (savedAvatar) {
            document.getElementById('avatarPreview').src = savedAvatar;
            document.getElementById('headerAvatar').src  = savedAvatar;
        }

        // Fetch de la info real del usuario
        try {
            console.log("1. Buscando info para el usuario:", savedUsername);

            const response = await fetch('https://footlel-backend.onrender.com/user/get-user-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_name: savedUsername })
            });

            console.log("2. Status del servidor:", response.status);

            if (response.ok) {
                const data = await response.json();
                console.log("3. Paquete exacto recibido del servidor:", data);
                
                // Extraer y guardar ID secreto en localStorage
                if (data.user_id) {
                    localStorage.setItem('footlel_user_id', data.user_id);
                }

                console.log("4. ¿Existe el casillero de email en el HTML?:", document.getElementById('email'));

                // Rellenar input de email estrictamente con la clave del backend
                if (data.user_email) {
                    document.getElementById('email').value = data.user_email;
                }
            } else {
                console.warn("No se pudo obtener la info del backend.");
            }
        } catch (error) {
            console.error("Error conectando con el backend:", error);
        }
    });

    /* Avatar Logic */
    const avatarPreview = document.getElementById('avatarPreview');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const baseAvatars = document.querySelectorAll('.base-avatar-option');

    uploadBtn.addEventListener('click', function () { fileInput.click(); });

    /* ── Rastreo del avatar seleccionado ──────────────────────────
       selectedAvatarSrc se actualiza cada vez que el usuario sube
       una imagen local o elige un robotito base. Al hacer submit
       se usa esta variable para garantizar que se guarde el src
       correcto, independientemente de lo que muestre el preview. */
    var selectedAvatarSrc = null;

    fileInput.addEventListener('change', function () {
        var file = this.files[0];
        if (file) {
            var reader = new FileReader();
            reader.onload = function (evt) {
                avatarPreview.src = evt.target.result;
                selectedAvatarSrc = evt.target.result;        // data: URI (imagen local)
                baseAvatars.forEach(function (btn) {
                    btn.classList.remove('is-selected');
                });
            };
            reader.readAsDataURL(file);
        }
    });

    baseAvatars.forEach(function (btn) {
        btn.addEventListener('click', function () {
            baseAvatars.forEach(function (b) { b.classList.remove('is-selected'); });
            this.classList.add('is-selected');
            var img = this.querySelector('img');
            if (img) {
                avatarPreview.src = img.src;
                selectedAvatarSrc = img.src;                  // URL de DiceBear (avatar base)
            }
        });
    });

    /* Toggle Password */
    var EYE_CLOSED = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    var EYE_OPEN  = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';

    document.querySelectorAll('.toggle-visibility').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(this.dataset.target);
            var svg   = document.getElementById('eye-' + this.dataset.target);
            if (input.type === 'password') {
                input.type = 'text';
                svg.innerHTML = EYE_OPEN;
                this.setAttribute('aria-label', 'Ocultar contraseña');
            } else {
                input.type = 'password';
                svg.innerHTML = EYE_CLOSED;
                this.setAttribute('aria-label', 'Mostrar contraseña');
            }
        });
    });

    /* Submit — Captura completa & Persist Pending Data */
    document.getElementById('editAccountForm').addEventListener('submit', function (e) {
        e.preventDefault();

        // 1. Nombre de usuario (clave esperada por el backend)
        const pendingUsername = document.getElementById('username').value.trim();
        localStorage.setItem('pending_user_name', pendingUsername);

        // 2. Correo electrónico
        const pendingEmail = document.getElementById('email').value.trim();
        localStorage.setItem('pending_user_email', pendingEmail);

        // 3. Nueva contraseña (puede estar vacía si el usuario no quiere cambiarla)
        const pendingPassword = document.getElementById('new-password').value;
        localStorage.setItem('pending_user_password', pendingPassword);

        // 4. Avatar seleccionado
        let avatarSeleccionado = null;

        // Prioridad 1: Robotito base con .is-selected
        const selectedBase = document.querySelector('.base-avatar-option.is-selected img');
        if (selectedBase) {
            avatarSeleccionado = selectedBase.src;
        } else if (selectedAvatarSrc) {
            // Prioridad 2: Imagen subida localmente (data: URI del FileReader)
            avatarSeleccionado = selectedAvatarSrc;
        }

        if (avatarSeleccionado) {
            localStorage.setItem('pending_avatar', avatarSeleccionado);
        }

        // 5. Redirigir al flujo de verificación de seguridad
        window.location.href = 'verificar-edicion.html';
    });
})();
</script>
</body>
</html>
